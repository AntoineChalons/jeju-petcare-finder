name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but never cancel one that is already
# running: a half-applied Pages deployment is worse than a queued one, and
# cancel-in-progress was itself producing "Deployment cancelled" failures.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests (JS)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5 is the first release whose runtime is Node 24. On v4 the runner
      # force-ran the action on Node 24 anyway (Node 20 is deprecated), and
      # the deployment then hung in `deployment_queued` until it timed out.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
